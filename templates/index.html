    <style>
        :root {
            --bg-body: #060304;
            --bg-sidebar: #0b0506;
            --bg-main: #090506;
            --bg-card: #130a0c;
            --bg-card-hover: #1a0f12;
            --bg-user-bubble: #2a0d12;
            --border-color: rgba(255, 255, 255, 0.07);
            --border-strong: rgba(255, 255, 255, 0.13);
            --border-hover: rgba(255, 43, 61, 0.4);
            --text-main: #f6eeee;
            --text-secondary: #b5a3a6;
            --text-muted: #7f6b6e;
            --accent: #ff2b3d;
            --accent-soft: #ff7a85;
            --accent-primary: #ff2b3d;
            --accent-gradient: linear-gradient(135deg, #ff3b4a 0%, #b0101f 100%);
            --mint: #d62839;
            --amber: #ff9a4d;
            --sky: #ff4d5a;
            --avatar-ai-gradient: linear-gradient(135deg, #2b1013 0%, #100607 100%);
            --avatar-user-gradient: linear-gradient(135deg, #ff3b4a 0%, #b0101f 100%);
            --shadow-float: 0 24px 60px -18px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Bricolage Grotesque', 'Plus Jakarta Sans', -apple-system, "Segoe UI", sans-serif;
            --font-mono: 'JetBrains Mono', "Fira Code", Consolas, monospace;
        }

        * { box-sizing: border-box; }

        html { color-scheme: dark; }

        body {
            margin: 0;
            font-family: var(--font-sans);
            background: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::selection { background: rgba(255, 43, 61, 0.35); color: #fff; }

        :focus-visible {
            outline: 2px solid var(--accent-soft);
            outline-offset: 2px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
            background-clip: content-box;
            border: 2px solid transparent;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 276px;
            min-width: 276px;
            background:
                radial-gradient(120% 60% at 0% 0%, rgba(255, 43, 61, 0.08), transparent 60%),
                var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px 14px;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        min-width 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        padding 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.25s ease,
                        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 40;
            box-sizing: border-box;
            overflow: hidden;
        }

        @media (min-width: 769px) {
            .sidebar.collapsed {
                width: 0 !important;
                min-width: 0 !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                border-right-width: 0 !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 4px 18px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            box-shadow: 0 6px 18px rgba(255, 59, 74, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.28);
            transition: transform 0.5s var(--ease-spring);
        }

        .brand:hover .brand-logo { transform: rotate(-8deg) scale(1.06); }

        .brand-name {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .brand-badge {
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 9999px;
            background: rgba(255, 43, 61, 0.14);
            color: var(--accent-soft);
            border: 1px solid rgba(255, 43, 61, 0.28);
        }

        .sidebar-collapse-btn {
            margin-left: auto;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
        }

        .sidebar-collapse-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: var(--border-color);
        }
        .sidebar-collapse-btn:active { transform: scale(0.92); }

        .new-chat {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-strong);
            background: rgba(255, 255, 255, 0.035);
            color: var(--text-main);
            padding: 11px 14px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.25s var(--ease-out), background 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .new-chat svg { transition: transform 0.4s var(--ease-spring); }
        .new-chat:hover svg { transform: rotate(90deg); }

        .new-chat::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.12) 50%, transparent 70%);
            transform: translateX(-120%);
            transition: transform 0.7s var(--ease-out);
            pointer-events: none;
        }
        .new-chat:hover::after { transform: translateX(120%); }

        .new-chat:hover {
            background: rgba(255, 43, 61, 0.13);
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(255, 59, 74, 0.18);
        }

        .new-chat:active { transform: translateY(0) scale(0.98); }

        .history-section-header {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 10px 8px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #conversationList {
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item {
            position: relative;
            padding: 8px 10px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, color 0.2s;
            user-select: none;
        }

        .history-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 3px;
            height: 0;
            border-radius: 0 3px 3px 0;
            background: var(--accent-gradient);
            transform: translateY(-50%);
            transition: height 0.3s var(--ease-out);
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .history-item.active {
            background: rgba(255, 43, 61, 0.12);
            color: #fff;
        }
        .history-item.active::before { height: 18px; }

        .history-item.pinned {
            background: rgba(255, 43, 61, 0.04);
        }
        .history-item.pinned:hover {
            background: rgba(255, 43, 61, 0.09);
        }
        .history-item.pinned.active {
            background: rgba(255, 43, 61, 0.15);
        }

        .history-item-icon {
            flex-shrink: 0;
            opacity: 0.65;
            transition: opacity 0.2s, color 0.2s;
        }
        .history-item.pinned .history-item-icon {
            opacity: 0.95;
            color: var(--accent-soft);
        }
        .history-item:hover .history-item-icon,
        .history-item.active .history-item-icon {
            opacity: 1;
            color: var(--accent-soft);
        }

        .history-item-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-actions {
            display: none;
            align-items: center;
            gap: 2px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .history-item:hover .history-item-actions,
        .history-item.active .history-item-actions {
            display: flex;
        }

        .history-action-btn {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.15s, color 0.15s, transform 0.15s;
        }
        .history-action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: scale(1.08);
        }
        .history-action-btn.pin-btn.is-pinned {
            color: var(--accent-soft);
        }
        .history-action-btn.delete-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        /* ---------- Main ---------- */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-main);
            position: relative;
            overflow: hidden;
        }

        /* Ambient background: slow-drifting colour fields */
        .ambient {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .ambient i {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            will-change: transform;
        }
        .ambient i:nth-child(1) {
            width: 520px; height: 520px; top: -180px; left: 8%;
            background: radial-gradient(circle, rgba(255, 59, 74, 0.55), transparent 68%);
            animation: drift1 26s ease-in-out infinite alternate;
        }
        .ambient i:nth-child(2) {
            width: 460px; height: 460px; top: 10%; right: -140px;
            background: radial-gradient(circle, rgba(214, 40, 57, 0.28), transparent 68%);
            animation: drift2 32s ease-in-out infinite alternate;
        }
        .ambient i:nth-child(3) {
            width: 420px; height: 420px; bottom: -160px; left: 30%;
            background: radial-gradient(circle, rgba(176, 16, 32, 0.32), transparent 68%);
            animation: drift3 38s ease-in-out infinite alternate;
        }
        @keyframes drift1 { to { transform: translate(120px, 70px) scale(1.15); } }
        @keyframes drift2 { to { transform: translate(-140px, 90px) scale(1.1); } }
        @keyframes drift3 { to { transform: translate(-110px, -60px) scale(1.2); } }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 26px;
            background: rgba(9, 5, 6, 0.62);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            position: relative;
            z-index: 10;
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; }

        .mobile-sidebar-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 7px;
            border-radius: 9px;
            transition: background 0.2s, color 0.2s, transform 0.2s, border-color 0.2s;
        }
        .mobile-sidebar-toggle:hover {
            background: rgba(255, 43, 61, 0.12);
            color: #fff;
            border-color: var(--border-hover);
        }
        .mobile-sidebar-toggle:active { transform: scale(0.92); }

        .topbar-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .status {
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            transition: color 0.3s, border-color 0.3s, background 0.3s;
        }

        .status::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6), 0 0 8px rgba(74, 222, 128, 0.7);
            flex-shrink: 0;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status.busy {
            color: #ffebec;
            border-color: rgba(176, 16, 32, 0.35);
            background: rgba(176, 16, 32, 0.08);
        }
        .status.busy::before {
            background: #ff6a77;
            box-shadow: 0 0 10px rgba(255, 90, 104, 0.9);
            animation: statusPulse 1.2s infinite ease-in-out;
        }

        .status.listening {
            color: #ffe4e4;
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.08);
        }
        .status.listening::before {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
            animation: statusPulse 0.85s infinite ease-in-out;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.45; }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 190px;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }

        /* ---------- Welcome / Homepage ---------- */
        .welcome {
            max-width: 880px;
            margin: 4px auto 0;
            text-align: center;
            position: relative;
            padding: 0 16px;
        }

        .welcome-aura { display: none; }

        /* Orbit hero — the one signature moment */
        .orbit {
            position: relative;
            width: 168px;
            height: 168px;
            margin: 0 auto 4px;
            display: grid;
            place-items: center;
            animation: orbitIn 1.1s var(--ease-out) both;
        }
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 122, 133, 0.2);
        }
        .orbit-ring.r1 { inset: 0; border-style: dashed; border-color: rgba(255, 122, 133, 0.16); animation: spinSlow 60s linear infinite; }
        .orbit-ring.r2 { inset: 24px; animation: spinSlow 38s linear infinite reverse; }
        .orbit-ring.r3 { inset: 48px; border-color: rgba(255, 122, 133, 0.28); }

        .orbit-ring::after {
            content: "";
            position: absolute;
            top: -4px;
            left: 50%;
            width: 8px;
            height: 8px;
            margin-left: -4px;
            border-radius: 50%;
            background: var(--accent-soft);
            box-shadow: 0 0 14px 2px rgba(255, 43, 61, 0.8);
        }
        .orbit-ring.r2::after { background: var(--mint); box-shadow: 0 0 14px 2px rgba(214, 40, 57, 0.8); top: auto; bottom: -4px; }
        .orbit-ring.r3::after { display: none; }

        .orbit-core {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: var(--accent-gradient);
            display: grid;
            place-items: center;
            color: #fff;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.18) inset,
                0 20px 50px -8px rgba(255, 59, 74, 0.65),
                0 0 80px rgba(176, 16, 32, 0.35);
            animation: coreFloat 6s ease-in-out infinite;
        }
        .orbit-core::before {
            content: "";
            position: absolute;
            inset: -11px;
            border-radius: 30px;
            border: 1px solid rgba(255, 122, 133, 0.35);
            animation: corePulse 3.2s ease-out infinite;
        }
        .orbit-core svg { filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25)); }

        @keyframes orbitIn {
            0% { opacity: 0; transform: scale(0.6) rotate(-25deg); filter: blur(10px); }
            100% { opacity: 1; transform: none; filter: blur(0); }
        }
        @keyframes spinSlow { to { transform: rotate(360deg); } }
        @keyframes coreFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @keyframes corePulse {
            0% { opacity: 0.8; transform: scale(0.92); }
            100% { opacity: 0; transform: scale(1.35); }
        }

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 6px 15px 6px 12px;
            border-radius: 9999px;
            background: rgba(255, 43, 61, 0.1);
            border: 1px solid rgba(255, 43, 61, 0.26);
            color: #ffc7cb;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 16px;
            animation: riseIn 0.8s var(--ease-out) 0.35s both;
        }

        .welcome-badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.9);
            animation: statusPulse 2s infinite ease-in-out;
        }

        .welcome h1, .welcome-title {
            font-family: var(--font-display);
            font-size: 42px;
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -0.035em;
            margin: 0 auto 14px;
            max-width: 760px;
            color: #fff;
            text-wrap: balance;
        }

        .welcome-title .w {
            display: inline-block;
            opacity: 0;
            transform: translateY(0.55em);
            filter: blur(8px);
            animation: wordIn 0.9s var(--ease-out) both;
            animation-delay: calc(0.5s + var(--i) * 0.065s);
        }
        @keyframes wordIn { to { opacity: 1; transform: none; filter: blur(0); } }

        .welcome p, .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 15.5px;
            line-height: 1.65;
            max-width: 600px;
            margin: 0 auto 20px;
            animation: riseIn 0.9s var(--ease-out) 1.05s both;
        }

        .welcome-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-bottom: 30px;
        }

        .welcome-pill {
            padding: 8px 16px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: default;
            animation: riseIn 0.7s var(--ease-out) backwards;
            animation-delay: calc(1.2s + var(--i) * 0.07s);
            transition: transform 0.3s var(--ease-spring), background 0.25s, border-color 0.25s, color 0.25s, box-shadow 0.25s;
        }
        .welcome-pill:hover {
            background: rgba(255, 43, 61, 0.12);
            border-color: var(--border-hover);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 24px -8px rgba(255, 59, 74, 0.45);
        }

        @keyframes riseIn {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: none; }
        }

        /* ---------- Suggestion Cards ---------- */
        .cards {
            max-width: 940px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            perspective: 1200px;
        }

        .card {
            --c: var(--accent);
            --c-rgb: 255, 43, 61;
            --mx: 50%;
            --my: 50%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            min-height: 184px;
            padding: 18px;
            border-radius: 20px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)), var(--bg-card);
            border: 1px solid var(--border-color);
            text-align: left;
            cursor: pointer;
            animation: riseIn 0.9s var(--ease-out) backwards;
            transition: transform 0.45s var(--ease-out), border-color 0.3s, box-shadow 0.45s var(--ease-out);
            will-change: transform;
        }
        .card:nth-child(1) { animation-delay: 1.45s; }
        .card:nth-child(2) { animation-delay: 1.57s; }
        .card:nth-child(3) { animation-delay: 1.69s; }

        .card-web { --c: #ff4d5a; --c-rgb: 255, 77, 90; }
        .card-doc { --c: #ff9a4d; --c-rgb: 255, 154, 77; }
        .card-vision, .card-calc { --c: #ff3b4a; --c-rgb: 255, 59, 74; }

        /* Cursor-following spotlight */
        .card-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(260px circle at var(--mx) var(--my), rgba(var(--c-rgb), 0.2), transparent 65%);
            transition: opacity 0.4s;
        }
        .card:hover .card-glow { opacity: 1; }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(var(--c-rgb), 0.5);
            box-shadow: 0 26px 50px -22px rgba(var(--c-rgb), 0.45), 0 0 0 1px rgba(var(--c-rgb), 0.12);
        }
        .card:active { transform: translateY(-2px) scale(0.985); transition-duration: 0.12s; }
        .card:focus-visible { outline-color: var(--c); }

        .card-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            color: var(--c);
            background: rgba(var(--c-rgb), 0.12);
            border: 1px solid rgba(var(--c-rgb), 0.28);
            transition: transform 0.5s var(--ease-spring), background 0.3s, color 0.3s;
        }
        .card:hover .card-icon {
            transform: rotate(-8deg) scale(1.1);
            background: var(--c);
            color: #090506;
        }

        .card-tag {
            font-size: 11.5px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            color: var(--c);
            background: rgba(var(--c-rgb), 0.1);
            border: 1px solid rgba(var(--c-rgb), 0.22);
        }

        .card-body { position: relative; }

        .card-title {
            font-family: var(--font-display);
            font-size: 17.5px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.015em;
            line-height: 1.3;
            margin-bottom: 7px;
        }

        .card-desc {
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .card-footer {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-strong);
        }

        .card-prompt-hint {
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .card:hover .card-prompt-hint { color: var(--c); }

        .card-arrow {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            flex-shrink: 0;
            transition: transform 0.4s var(--ease-spring), background 0.3s, color 0.3s;
        }
        .card:hover .card-arrow {
            background: var(--c);
            color: #090506;
            transform: translateX(4px);
        }

        /* ---------- Messages ---------- */
        .message {
            max-width: 840px;
            margin: 0 auto 28px;
            display: flex;
            gap: 14px;
            line-height: 1.7;
            animation: msgIn 0.5s var(--ease-out) both;
        }
        @keyframes msgIn {
            0% { opacity: 0; transform: translateY(14px) scale(0.985); }
            100% { opacity: 1; transform: none; }
        }

        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        .message.user .avatar { order: 2; }

        .message.user .message-content {
            order: 1;
            background: linear-gradient(160deg, #3a0f14, #26090d);
            border: 1px solid rgba(255, 43, 61, 0.2);
            border-radius: 20px 20px 5px 20px;
            padding: 12px 18px;
            max-width: 74%;
            box-shadow: 0 10px 26px -10px rgba(0, 0, 0, 0.55);
            color: #fff;
            white-space: pre-wrap;
        }

        .message.assistant .message-content {
            background: transparent;
            padding: 2px 0 0;
            max-width: 80%;
            flex: 1;
            color: #f0e5e5;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        .user-avatar { background: var(--avatar-user-gradient); box-shadow: 0 6px 16px rgba(255, 59, 74, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
        .bot-avatar { background: var(--avatar-ai-gradient); box-shadow: 0 6px 16px rgba(255, 43, 61, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25); }

        .message-content {
            font-size: 15.5px;
            overflow-wrap: anywhere;
            word-break: break-word;
            min-width: 0;
        }

        /* Typing indicator while the assistant bubble is still empty */
        .message.assistant .message-content:empty::before {
            content: "";
            display: block;
            width: 6px;
            height: 6px;
            margin: 15px 0 0 4px;
            border-radius: 50%;
            background: var(--accent-soft);
            box-shadow: 14px 0 0 var(--accent-soft), 28px 0 0 var(--accent-soft);
            animation: dotsFade 1.2s infinite ease-in-out;
        }
        @keyframes dotsFade { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

        /* Follow-up suggestions */
        .followup-suggestions {
            max-width: 840px;
            margin: -14px auto 28px;
            padding-left: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            animation: msgIn 0.55s var(--ease-out) both;
        }

        .followup-suggestions-label {
            flex: 0 0 100%;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .followup-suggestions-label svg { color: var(--amber); }

        .followup-suggestion {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            text-align: left;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 9px 14px;
            cursor: pointer;
            max-width: 100%;
            transition: transform 0.3s var(--ease-out), background 0.25s, border-color 0.25s, color 0.25s, box-shadow 0.3s;
        }
        .followup-suggestion svg { flex-shrink: 0; transition: transform 0.35s var(--ease-spring); }
        .followup-suggestion:hover {
            background: rgba(255, 43, 61, 0.12);
            border-color: var(--border-hover);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px -12px rgba(255, 59, 74, 0.6);
        }
        .followup-suggestion:hover svg { transform: translateX(3px); }
        .followup-suggestion:active { transform: scale(0.97); }

        /* ---------- Markdown content ---------- */
        .message-content p { margin: 0 0 14px; }
        .message-content p:last-child { margin-bottom: 0; }

        .message-content h1, .message-content h2, .message-content h3,
        .message-content h4, .message-content h5, .message-content h6 {
            font-family: var(--font-display);
            color: #fff;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin: 24px 0 10px;
        }
        .message-content h1 { font-size: 24px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .message-content h2 { font-size: 20px; }
        .message-content h3 { font-size: 17.5px; }
        .message-content h4, .message-content h5, .message-content h6 { font-size: 15.5px; }
        .message-content > :first-child { margin-top: 0; }

        .message-content ul, .message-content ol { margin: 0 0 14px; padding-left: 24px; }
        .message-content li { margin-bottom: 6px; }
        .message-content li::marker { color: var(--accent-soft); }

        .message-content blockquote {
            margin: 14px 0;
            padding: 10px 16px;
            border-left: 3px solid var(--accent);
            background: linear-gradient(90deg, rgba(255, 43, 61, 0.1), transparent);
            border-radius: 0 12px 12px 0;
            color: var(--text-secondary);
        }

        .message-content code {
            font-family: var(--font-mono);
            font-size: 0.88em;
            background: rgba(255, 43, 61, 0.13);
            color: #ffd3d6;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .message-content pre {
            position: relative;
            margin: 16px 0;
            padding: 16px 18px;
            background: #0b0607;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.9);
        }
        .message-content pre code {
            display: block;
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: 13.5px;
            line-height: 1.65;
            border-radius: 0;
        }

        .message-content table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 16px 0;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .message-content tr:first-child th:first-child { border-top-left-radius: 11px; }
        .message-content tr:first-child th:last-child { border-top-right-radius: 11px; }
        .message-content th, .message-content td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .message-content th {
            background: rgba(255, 43, 61, 0.1);
            color: #fff;
            font-weight: 600;
        }
        .message-content tr:last-child td { border-bottom: 0; }
        .message-content tr:nth-child(even) td { background: rgba(255, 255, 255, 0.02); }

        .message-content a {
            color: var(--accent-soft);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 122, 133, 0.35);
            transition: color 0.2s, border-color 0.2s;
        }
        .message-content a:hover { color: #fff; border-color: #fff; }

        .message-content hr { border: 0; height: 1px; background: var(--border-color); margin: 22px 0; }

        .message-content img { max-width: 100%; border-radius: 12px; }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            font-family: var(--font-sans);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-3px);
            transition: opacity 0.25s, transform 0.25s var(--ease-out), background 0.2s, color 0.2s, border-color 0.2s;
        }
        .message-content pre:hover .copy-btn,
        .copy-btn:focus-visible { opacity: 1; transform: none; }
        .copy-btn:hover {
            background: rgba(255, 43, 61, 0.25);
            border-color: var(--border-hover);
            color: #fff;
        }

        /* ---------- Tool progress ---------- */
        .tool-progress {
            max-width: 840px;
            margin: 0 auto 16px;
            padding-left: 50px;
            display: flex;
            justify-content: flex-start;
            animation: msgIn 0.4s var(--ease-out) both;
        }

        .tool-progress-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(19, 10, 12, 0.9);
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.7);
        }

        .tool-progress-box::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff2b3d, #ff4d5a, #d62839, #ff2b3d);
            background-size: 200% 100%;
            animation: shimmerLine 1.6s infinite linear;
        }
        @keyframes shimmerLine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .tool-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-top-color: var(--accent-soft);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .tool-check {
            color: #4ade80;
            font-weight: 800;
            font-size: 14px;
            display: inline-block;
            animation: checkPop 0.45s var(--ease-spring) both;
        }
        @keyframes checkPop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: none; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Composer ---------- */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, var(--bg-main) 55%, rgba(9, 5, 6, 0.85) 80%, transparent);
            padding: 34px 24px 22px;
            z-index: 20;
            pointer-events: none;
        }
        .input-area > * { pointer-events: auto; }

        .input-wrapper {
            max-width: 840px;
            margin: 0 auto;
            background: rgba(19, 10, 12, 0.88);
            border: 1px solid var(--border-strong);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            padding: 10px 12px;
            box-shadow: var(--shadow-float);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            transition: border-color 0.3s, box-shadow 0.4s var(--ease-out);
            position: relative;
        }

        .input-wrapper:focus-within {
            border-color: var(--border-strong);
            outline: none;
            box-shadow: var(--shadow-float);
        }

        /* Attachment */
        .attachment-row {
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 2px 2px 0;
            overflow: hidden;
        }
        .attachment-row[hidden] { display: none !important; }

        .attachment-preview {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px 6px 12px;
            background: rgba(255, 43, 61, 0.12);
            border: 1px solid rgba(255, 43, 61, 0.3);
            border-radius: 12px;
            color: #ffe5e7;
            font-size: 13px;
            font-weight: 500;
            max-width: 100%;
            width: fit-content;
            animation: chipIn 0.4s var(--ease-spring) both;
            transition: background 0.2s, border-color 0.2s;
        }
        @keyframes chipIn { 0% { opacity: 0; transform: translateY(8px) scale(0.9); } 100% { opacity: 1; transform: none; } }
        .attachment-preview:hover { background: rgba(255, 43, 61, 0.2); border-color: rgba(255, 43, 61, 0.5); }
        .attachment-preview[hidden] { display: none !important; }

        .attachment-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .attachment-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: min(480px, 60vw);
            color: #ffe5e7;
        }

        .remove-attachment {
            border: 0;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.12);
            color: #dccbcc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s, transform 0.3s var(--ease-spring);
            flex-shrink: 0;
            padding: 0;
        }
        .remove-attachment:hover { background: #ef4444; color: #fff; transform: rotate(90deg) scale(1.1); }

        .input-controls-row { width: 100%; display: flex; align-items: flex-end; gap: 6px; }
        .input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-bottom: 1px; }

        .attach-btn, .mic-btn, .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.3s var(--ease-spring), background 0.2s, color 0.2s, box-shadow 0.3s;
        }

        .attach-btn { background: transparent; color: var(--text-secondary); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;

        .welcome-pill { display: inline-flex; align-items: center; gap: 8px; }

        .welcome-pill:hover .pill-icon { color: #fff; transform: scale(1.15) rotate(-8deg); }

        /* ---------- Tit logo (bird mark) ---------- */
        .tit-logo { width: 100%; height: 100%; display: block; overflow: visible; transform-origin: 50% 88%; }
        .brand-logo { cursor: pointer; }
        .brand-logo .tit-logo { width: 24px; height: 24px; }

        .tit-eyeball, .tit-wing, .tit-tuft, .tit-tail {
            transform-box: fill-box;
        }
        .tit-eyeball { transform-origin: center; transition: transform 0.09s ease-out; }
        .tit-logo.blink .tit-eyeball { transform: scaleY(0.08); }
        .tit-pupil { transition: transform 0.12s ease-out; }
        .tit-wing { transform-origin: 12% 20%; }
        .tit-tuft { transform-origin: 20% 95%; }
        .tit-tail { transform-origin: 90% 40%; }

        .orbit-core { cursor: pointer; outline-offset: 6px; -webkit-tap-highlight-color: transparent; }
        .orbit-core .tit-logo { width: 78%; height: 78%; transition: transform 0.45s var(--ease-spring); }
        .orbit-core:hover .tit-logo { transform: scale(1.1) rotate(-5deg); }
        .orbit-core:hover .tit-tuft { animation: tuftWiggle 0.7s ease-in-out infinite; }
        .orbit-core:hover .tit-tail { animation: tailWag 0.55s ease-in-out infinite; }
        .orbit-core:active .tit-logo { transform: scale(0.9); transition-duration: 0.12s; }

        .tit-logo.hop { animation: titHop 0.75s var(--ease-out); }
        .tit-logo.flip { animation: titFlip 0.95s cubic-bezier(0.45, 0, 0.2, 1); }
        .tit-logo.flap .tit-wing { animation: wingFlap 0.22s ease-in-out 4; }

        @keyframes titHop {
            0%   { transform: scale(1, 1); }
            18%  { transform: scale(1.14, 0.84) translateY(3%); }
            48%  { transform: scale(0.92, 1.12) translateY(-26%) rotate(-7deg); }
            76%  { transform: scale(1.08, 0.92) translateY(2%) rotate(2deg); }
            100% { transform: scale(1, 1); }
        }
        @keyframes titFlip {
            0%   { transform: scale(1) rotate(0); }
            25%  { transform: scale(1.15, 0.85) translateY(4%); }
            60%  { transform: scale(1.1) translateY(-22%) rotate(200deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        @keyframes wingFlap { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-34deg); } }
        @keyframes tuftWiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(14deg); } 75% { transform: rotate(-10deg); } }
        @keyframes tailWag { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }

            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }

        .auth-field input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 43, 61, 0.22);
        }

        .auth-field input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .auth-submit-btn {
            width: 100%;
            padding: 11px;
            border-radius: 11px;
            background: var(--accent-gradient);
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            margin-top: 6px;
            box-shadow: 0 6px 20px rgba(255, 59, 74, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-submit-btn:hover {
            opacity: 0.94;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255, 59, 74, 0.45);
        }

        .auth-submit-btn:active {
            transform: translateY(0);
        }

        .auth-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ---------- Cursor-driven motion ---------- */
        .cursor-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
        }
        /* Each layer fades to fully transparent at its own edge (closest-side), so no visible rim */
        .cursor-glow i {
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 50%;
            mix-blend-mode: screen;
            will-change: transform;
        }
        .cursor-glow i:nth-child(1) {
            width: 860px; height: 860px;
            background: radial-gradient(closest-side, rgba(var(--fx-crimson), 0.20), rgba(var(--fx-crimson), 0.13) 24%, rgba(var(--fx-crimson), 0.06) 50%, rgba(var(--fx-crimson), 0.018) 76%, rgba(var(--fx-crimson), 0) 100%);
        }
        .cursor-glow i:nth-child(2) {
            width: 740px; height: 740px;
            background: radial-gradient(closest-side, rgba(var(--fx-blood), 0.17), rgba(var(--fx-blood), 0.11) 24%, rgba(var(--fx-blood), 0.05) 52%, rgba(var(--fx-blood), 0.015) 78%, rgba(var(--fx-blood), 0) 100%);
        }
        .cursor-glow i:nth-child(3) {
            width: 640px; height: 640px;
            background: radial-gradient(closest-side, rgba(var(--fx-ember), 0.13), rgba(var(--fx-ember), 0.08) 26%, rgba(var(--fx-ember), 0.035) 54%, rgba(var(--fx-ember), 0.01) 80%, rgba(var(--fx-ember), 0) 100%);
        }
        @media (hover: none) { .cursor-glow { display: none; } }

        /* 3D tilt on suggestion cards (values driven by JS, eased every frame) */
        .card,
        .card:hover,
        .card:active {
            transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px)) scale(var(--sc, 1));
            transition: border-color 0.3s, box-shadow 0.45s var(--ease-out);
        }

        /* Soft spotlight that follows the pointer inside small surfaces */
        .history-item, .user-profile-card, .followup-suggestion, .welcome-pill, .topbar-user-pill {
            --mx: 50%;
            --my: 50%;
            position: relative;
        }
        .followup-suggestion, .welcome-pill, .user-profile-card { overflow: hidden; }
        .history-item::after,
        .user-profile-card::after,
        .followup-suggestion::after,
        .welcome-pill::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(120px circle at var(--mx) var(--my), rgba(255, 122, 133, 0.22), transparent 70%);
            transition: opacity 0.3s;
        }
        .history-item:hover::after,
        .user-profile-card:hover::after,
        .followup-suggestion:hover::after,
        .welcome-pill:hover::after { opacity: 1; }

        .input-wrapper { --mx: 50%; --my: 0%; }
        .input-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(380px circle at var(--mx) var(--my), rgba(255, 43, 61, 0.13), transparent 65%);
            transition: opacity 0.4s;
        }
        .input-wrapper:hover::after { opacity: 1; }

        .auth-modal-container { translate: var(--mtx, 0px) var(--mty, 0px); }

        /* ---------- Hover & light refinements ---------- */
        :root {
            --fx-crimson: 255, 30, 50;
            --fx-blood: 190, 18, 38;
            --fx-ember: 255, 110, 40;
        }

        /* Ambient fields sit a touch lower so the cursor wash does not over-brighten the page */
        .ambient i { opacity: 0.42; }

        /* Suggestion cards: border light that follows the cursor, in each card's own colour */
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(240px circle at var(--mx) var(--my), rgba(var(--c-rgb), 0.95), rgba(var(--c-rgb), 0.42) 38%, rgba(var(--c-rgb), 0.07) 72%, transparent 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            transition: opacity 0.35s;
        }
        .card:hover::before { opacity: 1; }
        .card:hover {
            border-color: rgba(var(--c-rgb), 0.14);
            box-shadow: 0 22px 44px -28px rgba(var(--c-rgb), 0.4);
        }
        .card-glow {
            background: radial-gradient(300px circle at var(--mx) var(--my), rgba(var(--c-rgb), 0.12), transparent 70%);
        }
        /* Tinted instead of solid fills, so the icon and arrow do not compete with the border light */
        .card:hover .card-icon {
            background: rgba(var(--c-rgb), 0.2);
            color: var(--c);
            border-color: rgba(var(--c-rgb), 0.55);
            box-shadow: 0 0 22px -6px rgba(var(--c-rgb), 0.55);
        }
        .card:hover .card-arrow {
            background: rgba(var(--c-rgb), 0.2);
            color: var(--c);
        }

        /* Chat input: gradient edge that follows the cursor on hover and settles into a slow blue-violet-cyan glow on focus */
        .input-wrapper::after {
            background: radial-gradient(380px circle at var(--mx) var(--my), rgba(var(--fx-crimson), 0.07), transparent 65%);
        }
        .input-wrapper::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1.5px;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(300px circle at var(--mx) var(--my), rgba(var(--fx-ember), 0.9), rgba(var(--fx-crimson), 0.5) 36%, rgba(var(--fx-blood), 0.2) 62%, transparent 82%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            transition: opacity 0.4s;
        }
        .input-wrapper:hover::before { opacity: 1; }
        .input-wrapper:hover {
            box-shadow: var(--shadow-float), 0 22px 54px -36px rgba(var(--fx-crimson), 0.45);
        }
        .input-wrapper:focus-within {
            border-color: transparent;
            box-shadow: var(--shadow-float), 0 0 0 4px rgba(var(--fx-crimson), 0.06), 0 26px 64px -32px rgba(var(--fx-blood), 0.55);
        }
        .input-wrapper:focus-within::before {
            opacity: 1;
            background:
                radial-gradient(300px circle at var(--mx) var(--my), rgba(var(--fx-ember), 0.8), transparent 70%),
                linear-gradient(115deg, rgba(var(--fx-crimson), 0.75), rgba(var(--fx-blood), 0.75) 50%, rgba(var(--fx-ember), 0.75) 100%);
            background-size: 100% 100%, 220% 100%;
            animation: inputRingShift 7s ease-in-out infinite alternate;
        }
        @keyframes inputRingShift {
            from { background-position: 0 0, 0% 0; }
            to   { background-position: 0 0, 100% 0; }
        }

        /* Buttons: one light sweep + a small lift (New chat already has its own sweep) */
        .send-btn, .auth-open-btn, .auth-submit-btn, .topbar-login-btn {
            position: relative;
            overflow: hidden;
        }
        .send-btn::after, .auth-open-btn::after, .auth-submit-btn::after, .topbar-login-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.2) 50%, transparent 70%);
            transform: translateX(-130%);
            transition: transform 0.75s var(--ease-out);
        }
        .send-btn:hover:not(:disabled)::after,
        .auth-open-btn:hover::after,
        .auth-submit-btn:hover:not(:disabled)::after,
        .topbar-login-btn:hover::after { transform: translateX(130%); }

        .topbar-login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -10px rgba(var(--fx-crimson), 0.7);
        }
        .topbar-login-btn:active { transform: scale(0.96); }
        .auth-open-btn:hover { box-shadow: 0 8px 20px -10px rgba(var(--fx-crimson), 0.7); }
        .auth-open-btn:active { transform: scale(0.98); }
        .auth-submit-btn:active:not(:disabled) { transform: scale(0.985); }

        /* Calmer secondary hover lights (less stacking with the cursor wash) */
        .history-item::after,
        .user-profile-card::after,
        .followup-suggestion::after,
        .welcome-pill::after {
            background: radial-gradient(130px circle at var(--mx) var(--my), rgba(255, 122, 133, 0.14), transparent 70%);
        }
        .welcome-pill:hover { box-shadow: 0 8px 20px -12px rgba(var(--fx-crimson), 0.45); }
        .followup-suggestion:hover { box-shadow: 0 8px 18px -12px rgba(var(--fx-crimson), 0.4); }

        @media (prefers-reduced-motion: reduce) {
            .input-wrapper:focus-within::before { animation: none; }
        }

        /* ---------- Crow logo details & red/pink theme extras ---------- */
        .tit-sclera { transition: fill 0.3s; }
        .orbit-core:hover .tit-sclera { fill: #ff9aa3; }
        .tit-logo.redeye .tit-sclera { fill: #ff1f35; filter: drop-shadow(0 0 3px rgba(255, 31, 53, 0.95)); }
        .orbit-core .tit-logo { filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35)); }

        .bot-avatar { border: 1px solid rgba(255, 43, 61, 0.38); }

        /* Code highlighting in the same palette */
        .hljs { background: transparent; color: #f0e5e5; }
        .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag { color: #ff5a67; }
        .hljs-string, .hljs-regexp, .hljs-addition { color: #ffb06b; }
        .hljs-number, .hljs-symbol, .hljs-bullet, .hljs-variable { color: #ff8f99; }
        .hljs-title, .hljs-section, .hljs-title.function_ { color: #ffd6d9; }
        .hljs-built_in, .hljs-type, .hljs-class .hljs-title { color: #ff8a94; }
        .hljs-attr, .hljs-attribute { color: #ff7280; }
        .hljs-comment, .hljs-quote { color: #7f6b6e; font-style: italic; }
        .hljs-deletion { color: #ff8a8a; }

        /* Crow: bigger on the tile, menacing red eye on hover / click */
        .orbit-core .tit-logo { width: 90%; height: 90%; }
        .brand-logo .tit-logo { width: 28px; height: 28px; }
        .tit-sclera { filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.7)); }
        .orbit-core:hover .tit-sclera { fill: #ff9aa3; }
        .tit-logo.redeye .tit-sclera { fill: #ff1f35; filter: drop-shadow(0 0 2.5px rgba(255, 31, 53, 1)); }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="brand">
        <div class="brand-logo" id="brandLogo" role="button" tabindex="0" aria-label="Logo Tit"></div>
        <span class="brand-name">Tit</span>
        <span class="brand-badge">3.0</span>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" onclick="toggleSidebar()" aria-label="Thu gọn thanh bên" title="Thu gọn thanh bên (Ctrl+B)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>
    </div>

    <button class="new-chat" onclick="newChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New chat</span>
    </button>

    <div id="conversationList"></div>
    <div class="sidebar-user-section" id="sidebarUserSection"></div>
</aside>

<div class="sidebar-scrim" aria-hidden="true"></div>

<main class="main">
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="topbar">
        <div class="topbar-left">
            <button class="mobile-sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Đóng/Mở thanh bên" title="Đóng/Mở thanh bên (Ctrl+B)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="topbar-title">Tit Chatbot</div>
        </div>
        <div class="topbar-right">
            <div class="status" id="status">Ready</div>
            <div id="topbarUserArea"></div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
        <div class="input-wrapper">
            <input
                type="file"
                id="fileInput"
                style="display: none;"
                accept=".pdf,.docx,.txt,.md,.py,.csv,.jpg,.jpeg,.png,.webp"
                onchange="uploadFile()"
            >

            <!-- Attachment container row (hidden by default until file is selected) -->
            <div class="attachment-row" id="attachmentRow" hidden>
                <div class="attachment-preview" id="attachmentPreview"></div>
            </div>

            <!-- Main input controls row -->
            <div class="input-controls-row">
                <button class="attach-btn" onclick="openFilePicker()" title="Upload document or image">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Ask anything, or attach a file and ask about it..."
                    rows="1"
                    oninput="autoResize(this)"
                    onkeydown="handleKeyDown(event)"
                ></textarea>

                <div class="input-actions">
                    <select id="modelSelect" class="model-select" title="Select model">
                        <option value="openai/gpt-oss-20b">GPT-OSS 20B (Default)</option>
                        <option value="qwen/qwen3.8-27b">Qwen 3.8 27B</option>
                        <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
                    </select>

                    <button class="mic-btn" id="micBtn" onclick="toggleDictation()" title="Dictate voice">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>

                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="notice" id="noticeText">
            Tit can make mistakes. Check important info.
        </div>
    </div>
</main>

<script>
    function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/[&<>"']/g, m => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[m]));
    }

    function toggleSidebar() {
        const sidebar = document.querySelector(".sidebar");
        if (!sidebar) return;
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle("open");
        } else {
            sidebar.classList.toggle("collapsed");
            try {
                localStorage.setItem("sidebar_collapsed", sidebar.classList.contains("collapsed") ? "true" : "false");
            } catch (e) {}
        }
    }

    // Phím tắt Ctrl+B hoặc Cmd+B để đóng/mở thanh bên
    window.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
            const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
            if (tag !== "input" && tag !== "textarea") {
                e.preventDefault();
                toggleSidebar();
            }
        }
    });

    // Close sidebar when clicking outside on mobile
    document.addEventListener("click", (e) => {
        const sidebar = document.querySelector(".sidebar");
        const toggle = document.getElementById("sidebarToggle");
        const collapseBtn = document.getElementById("sidebarCollapseBtn");
        if (window.innerWidth <= 768 && sidebar && sidebar.classList.contains("open")) {
            if (!sidebar.contains(e.target) && (!toggle || !toggle.contains(e.target)) && (!collapseBtn || !collapseBtn.contains(e.target))) {
                sidebar.classList.remove("open");
            }
        }
    });

    // ---- Configure marked.js ----
    marked.setOptions({
        breaks: true,       // \n → <br> inside paragraphs
        gfm: true,          // GitHub Flavored Markdown
        highlight: function(code, lang) {
            try {
                if (typeof hljs !== "undefined" && lang && hljs.getLanguage && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                if (typeof hljs !== "undefined" && hljs.highlightAuto) {
                    return hljs.highlightAuto(code).value;
                }
            } catch (e) {
                console.warn("highlight.js error:", e);
            }
            return code;
        }
    });

    /** Render Markdown string to sanitized HTML and apply to an element. */
    function renderMarkdown(el, text) {
        // Parse markdown → HTML
        try {
            el.innerHTML = marked.parse(text || "");
        } catch (e) {
            el.textContent = text || "";
            return;
        }

        // Syntax highlight all code blocks if hljs is available
        if (typeof hljs !== "undefined" && hljs.highlightElement) {
            el.querySelectorAll("pre code").forEach(block => {
                try {
                    hljs.highlightElement(block);
                } catch (e) {}
            });
        }

        // Add copy button to every <pre>
        el.querySelectorAll("pre").forEach(pre => {
            if (pre.querySelector(".copy-btn")) return; // already added
            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span>Copy</span>`;
            btn.onclick = () => {
                const code = pre.querySelector("code");
                navigator.clipboard.writeText(code ? code.innerText : pre.innerText)
                    .then(() => {
                        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> <span style="color:#10b981">Copied!</span>`;
                        setTimeout(() => {
                            btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span>Copy</span>`;
                        }, 2000);
                    })
                    .catch(() => {
                        btn.textContent = "Error";
                    });
            };
            pre.appendChild(btn);
        });

        // Open links in new tab safely
        el.querySelectorAll("a").forEach(a => {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
        });
    }

    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const conversationList = document.getElementById("conversationList");
    const modelSelect = document.getElementById("modelSelect");
    const noticeText = document.getElementById("noticeText");
    const micBtn = document.getElementById("micBtn");

    // Dynamic dot pulsing when status changes
    const statusObserver = new MutationObserver(() => {
        const text = (statusText.textContent || "").trim().toLowerCase();
        if (text === "ready") {
            statusText.classList.remove("busy", "listening");
        } else if (text.includes("listening")) {
            statusText.classList.remove("busy");
            statusText.classList.add("listening");
        } else {
            statusText.classList.remove("listening");
            statusText.classList.add("busy");
        }
    });
    if (statusText) {
        statusObserver.observe(statusText, { childList: true, characterData: true, subtree: true });
    }

    let pendingFile = null;
    let threadId = localStorage.getItem("thread_id");

    if (!threadId) {
        threadId = crypto.randomUUID();
        localStorage.setItem("thread_id", threadId);
    }

    const savedModel = localStorage.getItem("selected_model");

    if (savedModel && modelSelect) {
        modelSelect.value = savedModel;
    }

    if (modelSelect) {
        modelSelect.addEventListener("change", () => {
            localStorage.setItem("selected_model", modelSelect.value);

            if (noticeText) {
                noticeText.textContent = `Selected model: ${modelSelect.value}`;
            }
        });
    }

    let recognition = null;
    let isDictating = false;

    function setupSpeechRecognition() {
        const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            return null;
        }

        const speechRecognition = new SpeechRecognition();

        speechRecognition.lang = "en-US";
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;

        speechRecognition.onstart = () => {
            isDictating = true;

            if (micBtn) {
                micBtn.classList.add("recording");
                micBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>`;
            }

            statusText.textContent = "Listening...";
        };

        speechRecognition.onresult = (event) => {
            let finalTranscript = "";
            let interimTranscript = "";

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;

                if (event.results[i].isFinal) {
                    finalTranscript += transcript + " ";
                } else {
                    interimTranscript += transcript;
                }
            }

            if (finalTranscript) {
                const currentText = messageInput.value.trim();

                messageInput.value = currentText
                    ? currentText + " " + finalTranscript.trim()
                    : finalTranscript.trim();

                autoResize(messageInput);
            }

            if (interimTranscript && noticeText) {
                noticeText.textContent = "Listening: " + interimTranscript;
            }
        };

        speechRecognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);

            if (event.error === "not-allowed") {
                alert("Microphone permission denied. Please allow microphone access.");
            }

            stopDictation();
        };

        speechRecognition.onend = () => {
            if (isDictating) {
                try {
                    speechRecognition.start();
                } catch (error) {
                    stopDictation();
                }
            }
        };

        return speechRecognition;
    }

    function toggleDictation() {
        if (!recognition) {
            recognition = setupSpeechRecognition();
        }

        if (!recognition) {
            alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
            return;
        }

        if (isDictating) {
            stopDictation();
        } else {
            startDictation();
        }
    }

    function startDictation() {
        try {
            recognition.start();
        } catch (error) {
            console.error("Could not start dictation:", error);
        }
    }

    function stopDictation() {
        isDictating = false;

        if (recognition) {
            try {
                recognition.stop();
            } catch (error) {
                console.error("Could not stop dictation:", error);
            }
        }

        if (micBtn) {
            micBtn.classList.remove("recording");
            micBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;

        statusText.textContent = "Ready";

        if (noticeText) {
            noticeText.textContent = "Tit can make mistakes. Check important info.";
        }

        messageInput.focus();
    }

    function addFollowupSuggestions(questions, assistantMessage) {
        const cleanQuestions = questions
            .filter(question => typeof question === "string" && question.trim())
            .slice(0, 2);
        if (cleanQuestions.length !== 2) return false;

        const oldSuggestions = assistantMessage.parentElement.nextElementSibling;
        if (oldSuggestions && oldSuggestions.classList.contains("followup-suggestions")) {
            oldSuggestions.remove();
        }

        const container = document.createElement("div");
        container.className = "followup-suggestions";

        const label = document.createElement("span");
        label.className = "followup-suggestions-label";
        label.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg> Suggested prompts`;
        container.appendChild(label);

        for (const question of cleanQuestions) {
            const button = document.createElement("button");
            button.className = "followup-suggestion";
            button.type = "button";
            button.innerHTML = `<span>${escapeHtml(question)}</span> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
            button.title = "Use this prompt";
            button.onclick = () => {
                messageInput.value = question;
                autoResize(messageInput);
                messageInput.focus();
            };
            container.appendChild(button);
        }

        assistantMessage.parentElement.insertAdjacentElement("afterend", container);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return true;
    }
